name: macOS host tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &host_paths
      - ".github/workflows/macos-host-tests.yml"
      - "Makefile"
      - "src/**"
      - "tests/unit/**"
      - "host/platform_host.cpp"
      - "tools/build-tests.sh"
      - "tools/ninja-build.sh"
      - "tools/setup-test-dependencies.sh"
  pull_request:
    paths: *host_paths

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOST_CC: /usr/bin/clang
      HOST_CXX: /usr/bin/clang++
      USE_CCACHE: 0
      HOST_TEST_LDFLAGS: "-Wl,-dead_strip"
      ASAN_OPTIONS: "detect_leaks=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure the arm64 toolchain
        run: |
          test "$(uname -m)" = arm64
          brew install ninja coreutils bash wget
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Run the showcase unit tests
        run: |
          set -e
          "$HOST_CXX" --version
          make test-unit
          link=$(ninja -f build/tests/build.ninja -t commands | tail -n 1)
          printf '%s\n' "$link"
          [[ $link != *--gc-sections* ]]
